spring.application.name=sentinel-aml

# --- Datasource -------------------------------------------------------------
# The defaults below target a throwaway local PostgreSQL instance so the project
# runs out of the box for reviewers. Every value is overridable by environment
# variable; in any real environment SENTINEL_DB_USER / SENTINEL_DB_PASSWORD must
# be supplied externally and these defaults must never be relied upon.
spring.datasource.url=${SENTINEL_DB_URL:jdbc:postgresql://localhost:5432/sentinel_aml}
spring.datasource.username=${SENTINEL_DB_USER:postgres}
spring.datasource.password=${SENTINEL_DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SENTINEL_DB_POOL_SIZE:20}
spring.datasource.hikari.pool-name=sentinel-pool

# --- JPA / Hibernate --------------------------------------------------------
# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Platform defaults ------------------------------------------------------
sentinel.base-currency=USD

# --- File upload ------------------------------------------------------------
# Bulk CSV ingestion is a first-class entry point, and Spring's 1MB default
# would reject a file of a few thousand transactions. The limit is still finite
# on purpose: an unbounded upload is a denial-of-service vector.
spring.servlet.multipart.max-file-size=${SENTINEL_MAX_UPLOAD_SIZE:128MB}
spring.servlet.multipart.max-request-size=${SENTINEL_MAX_UPLOAD_SIZE:128MB}

# --- API docs ---------------------------------------------------------------
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging ----------------------------------------------------------------
logging.level.com.azentio.aml=INFO
