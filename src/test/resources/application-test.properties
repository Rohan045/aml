# H2's REGULAR mode rejects check constraints that evaluate to NULL, which PostgreSQL permits;
# PostgreSQL mode keeps the test database faithful to the production target.
spring.datasource.url=jdbc:h2:mem:sentinel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations are Postgres-specific; tests derive the schema from the entity model instead.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.com.azentio.aml=DEBUG
